<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Maintenance Control</title>
<style>
:root{--bg:#11151a;--p:#1a2027;--p2:#222a33;--ln:#2d3741;--tx:#e8ecef;--mu:#8a97a4;--y:#f2b705;--r:#e5484d;--o:#f08c00;--g:#3fb27f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Bahnschrift,"Segoe UI",Arial,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--p);border-right:1px solid var(--ln);padding:18px 0;position:sticky;top:0;height:100vh;flex:none}
.brand{padding:0 18px 18px;font-size:16px;font-weight:700;border-bottom:4px solid var(--y);margin-bottom:8px}.brand small{display:block;color:var(--mu);font-weight:400;font-size:12px}
nav a{display:block;padding:11px 18px;color:var(--mu);text-decoration:none;border-left:4px solid transparent;cursor:pointer}
nav a.on,nav a:hover{color:var(--tx);background:var(--p2);border-left-color:var(--y)}
main{flex:1;padding:22px 26px;min-width:0}h1{margin:0 0 14px;font-size:22px}h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--p);border:1px solid var(--ln);padding:14px}.kpi b{display:block;font-size:30px;line-height:1.1}.kpi span{color:var(--mu);font-size:12px}
.kpi.bad{border-left:4px solid var(--r)}.kpi.warn{border-left:4px solid var(--o)}.kpi.ok{border-left:4px solid var(--g)}
.banner{padding:12px 16px;margin-bottom:14px;font-weight:700;border-left:6px solid}.banner.ATTENTION{background:#3a1d20;border-color:var(--r)}.banner.WATCH{background:#3a2d12;border-color:var(--o)}.banner.NORMAL{background:#15302a;border-color:var(--g)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:400;font-size:12px}
tr.c{cursor:pointer}tr.c:hover{background:var(--p2)}.wrap{overflow-x:auto}
.b{display:inline-block;padding:2px 8px;font-size:12px;font-weight:700;color:#111}.b.HIGH,.b.CRITICAL{background:var(--r);color:#fff}.b.MEDIUM{background:var(--o)}.b.LOW{background:var(--g)}
.bar{height:8px;background:var(--p2);margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--y)}
svg.ch{width:100%;height:auto}svg text{fill:var(--mu);font-size:10px}svg text.v{fill:var(--tx)}
#drawer{position:fixed;right:0;top:0;height:100vh;width:min(480px,100%);background:var(--p);border-left:4px solid var(--y);padding:20px;overflow:auto;transform:translateX(100%);transition:transform .2s}#drawer.on{transform:none}
#drawer button.x{float:right;background:none;border:1px solid var(--ln);color:var(--tx);padding:4px 10px;cursor:pointer}
li{margin-bottom:4px}.al{border-left:5px solid var(--r);margin-bottom:10px}.al.MEDIUM{border-color:var(--o)}.al.HIGH{border-color:var(--r)}
#chat{height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px}.msg{padding:10px 12px;max-width:85%;white-space:pre-wrap}.msg.u{align-self:flex-end;background:#3a3010}.msg.a{background:var(--p2);border-left:4px solid var(--y)}
.chips button,.send{background:var(--p2);color:var(--tx);border:1px solid var(--ln);padding:7px 10px;margin:0 6px 6px 0;cursor:pointer}.send{background:var(--y);color:#111;font-weight:700}
input{flex:1;background:var(--p2);border:1px solid var(--ln);color:var(--tx);padding:9px}.err{color:var(--r);padding:20px}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9}#login .card{width:320px;border-top:4px solid var(--y)}#login input{width:100%;margin-bottom:10px}#who{padding:14px 18px;color:var(--mu);font-size:12px}
.pc button.on{background:var(--y);color:#111;font-weight:700}select{background:var(--p2);color:var(--tx);border:1px solid var(--ln);padding:8px}.up{color:var(--r);font-weight:700}.dn{color:var(--g);font-weight:700}.why{border-left:5px solid var(--o);margin-bottom:10px}
.rec{border-left:5px solid var(--o);margin-bottom:12px}.rec.HIGH{border-color:var(--r)}.rec.LOW{border-color:var(--g)}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow:auto}.brand{display:none}nav a{white-space:nowrap}}
</style></head><body>
<nav><div class="brand">PLANT CONTROL<small>Maintenance &amp; Spares AI</small></div>
<a data-p="dashboard">Dashboard</a><a data-p="machines">Machine Maintenance</a><a data-p="parts">Spare Parts &amp; Inventory</a><a data-p="forecast">Demand Forecast</a><a data-p="alerts">Alerts</a><a data-p="recommendations">Planning &amp; Recommendations</a><a data-p="simulator">What-If Simulator</a><a data-p="assistant">AI Assistant</a><div id="who"></div></nav>
<div id="login"><div class="card"><h2>Plant Control sign in</h2><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')doLogin()"><button class="send" onclick="doLogin()">Sign in</button><p id="lerr" class="err" style="padding:6px 0"></p><small style="color:var(--mu)">Demo: admin / admin123 (can edit data), viewer / viewer123 (read only)</small></div></div><main id="main">Loading...</main><aside id="drawer"></aside>
<script>
const $=s=>document.querySelector(s);
let TOK=localStorage.getItem('tok'),ROLE=localStorage.getItem('role'),USER=localStorage.getItem('user');
const api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+TOK};const r=await fetch(u,o);if(r.status==401){logout();throw new Error('Please sign in')}if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}if(Array.isArray(d))d=d.map(x=>x.loc.slice(1).join('.')+': '+x.msg).join('; ');throw new Error(d||u+' returned '+r.status)}return r.json()};
const B=l=>`<span class="b ${l}">${l}</span>`;
const bars=(v,l,w=360,h=140)=>{const mx=Math.max(...v,1),bw=w/v.length;return `<svg class="ch" viewBox="0 0 ${w} ${h}">`+v.map((x,i)=>{const bh=x/mx*(h-38);return `<rect x="${i*bw+6}" y="${h-20-bh}" width="${bw-12}" height="${bh}" fill="${i==v.length-1?'#f2b705':'#4b5b6b'}"/><text x="${i*bw+bw/2}" y="${h-6}" text-anchor="middle">${l[i]}</text><text class="v" x="${i*bw+bw/2}" y="${h-24-bh}" text-anchor="middle">${x}</text>`}).join('')+`</svg>`};
const line=(v,c)=>{const w=300,h=80,mn=Math.min(...v)*.95,mx=Math.max(...v)*1.05,pt=v.map((x,i)=>`${10+i*(w-20)/(v.length-1)},${h-8-(x-mn)/(mx-mn||1)*(h-16)}`);return `<svg class="ch" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${c}" stroke-width="3" points="${pt.join(' ')}"/><text x="4" y="10">${v[0]}</text><text x="${w-30}" y="10">${v[v.length-1]}</text></svg>`};
const kpi=(n,l,c='')=>`<div class="card kpi ${c}"><b>${n}</b><span>${l}</span></div>`;
let M=[],P=[];
async function load(){[M,P]=await Promise.all([api('/api/machines'),api('/api/parts')])}
const pages={
async recommendations(){return recPage()},
async simulator(){return simPage()},
async dashboard(){const d=await api('/api/dashboard'),k=d.kpis;
 return `<h1>Car Plant Maintenance Overview</h1><div class="banner ${k.status.split(' ')[0]}">Overall plant maintenance status: ${k.status}</div>
 <div class="grid k">${kpi(k.machines,'Production machines')}${kpi(k.urgent,'Urgent maintenance','bad')}${kpi(k.high_risk,'Machines at HIGH/MEDIUM risk','warn')}${kpi(k.low_stock,'Parts below reorder level','bad')}${kpi(k.insufficient,'Parts predicted insufficient','warn')}${kpi(k.upcoming_pm,'PM due within 30 days','warn')}${kpi(k.demand_next,'Predicted spares demand (units, next month)','ok')}</div><br>
 <div class="grid two"><div class="card"><h2>Total spare-part consumption (units/month, last bar = forecast)</h2>${bars(d.demand_chart.values,d.demand_chart.labels)}</div>
 <div class="card"><h2>Top maintenance priorities</h2><table>${d.top_machines.map(m=>`<tr class="c" onclick="machine('${m.id}')"><td>${m.id}<br><small>${m.name}</small></td><td>${m.score}/100</td><td>${B(m.priority)}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Upcoming preventive maintenance</h2><table>${d.upcoming.map(u=>`<tr><td>${u.id} ${u.name}</td><td>${u.due_in<0?`<b style="color:var(--r)">Overdue ${-u.due_in} d</b>`:`in ${u.due_in} days`}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Spare-part shortage watch</h2><table>${d.shortages.map(s=>`<tr class="c" onclick="part('${s.id}')"><td>${s.id} ${s.name}</td><td>${s.stock} / ${s.demand}</td><td>${B(s.risk)}</td><td>order ${s.reorder_qty}</td></tr>`).join('')}</table></div></div>`},
async machines(){await load();return `<h1>Machine Maintenance Prioritization</h1>${isAdmin()?'<p><button class="send" onclick="addMachine()">+ Add machine</button></p>':''}<div class="card wrap"><table><tr><th>Machine</th><th>Line</th><th>Criticality</th><th>Failures</th><th>Vibration</th><th>Temp</th><th>Days since PM</th><th>Score</th><th>Priority</th></tr>${M.map(m=>`<tr class="c" onclick="machine('${m.id}')"><td><b>${m.id}</b> ${m.name}</td><td>${m.line}</td><td>${m.crit}/5</td><td>${m.failures}</td><td>${m.vib.at(-1)} mm/s</td><td>${m.temp.at(-1)} C</td><td>${m.days}/${m.interval}</td><td>${m.score}</td><td>${B(m.priority)}</td></tr>`).join('')}</table></div><p style="color:var(--mu)">Click a machine to see why it received its priority.</p>`},
async parts(){await load();return `<h1>Spare Parts, Inventory &amp; Reorder Priority</h1>${isAdmin()?'<p><button class="send" onclick="addPart()">+ Add spare part</button></p>':''}<div class="card wrap"><table><tr><th>Part</th><th>Stock</th><th>Predicted demand</th><th>Lead time</th><th>Safety</th><th>Reorder level</th><th>Shortage risk</th><th>Reorder qty</th><th>Reorder priority</th></tr>${P.map(p=>`<tr class="c" onclick="part('${p.id}')"><td><b>${p.id}</b> ${p.name}</td><td>${p.stock}</td><td>${p.demand}</td><td>${p.lead} d</td><td>${p.safety}</td><td>${p.rol}</td><td>${B(p.risk)}</td><td>${p.reorder_qty}</td><td>${p.reorder_qty?B(p.priority):'None'}</td></tr>`).join('')}</table></div><p style="color:var(--mu)">Sorted by reorder priority. Click a part for the reasoning.</p>`},
async forecast(){await load();return `<h1>Spare-Part Demand Forecast</h1><p style="color:var(--mu)">Method: weighted moving average of the last 3 months (50/30/20) + monthly trend, scaled up by the risk score of the machines using the part. Yellow bar = next-month forecast (${P[0].next}).</p><div class="grid two">${P.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(p=>`<div class="card"><h2>${p.id} ${p.name} ${B(p.risk)}</h2>${bars([...p.hist,p.demand],[...p.labels,p.next])}<small>Stock ${p.stock} | Lead ${p.lead} d | Safety ${p.safety} | Reorder level ${p.rol} | Cover ${p.cover_days} days</small></div>`).join('')}</div>`},
async alerts(){const a=await api('/api/alerts');return `<h1>Alerts</h1>`+(a.length?a.map(x=>`<div class="card al ${x.level}"><b>${B(x.level)} ${x.title}</b><br><small>${x.type}</small><div>${x.detail}</div></div>`).join(''):'<div class="card">No active alerts. All machines and stock levels are within limits.</div>')},
async assistant(){const qs=['Which machines should we maintain first?','Which spare parts are likely to run out?','Why is Robotic Welding Arm RW-04 high priority?','What spare parts should we reorder this week?','Which machine has the highest failure risk?','Why should bearing B-104 be reordered?','Is conveyor CV-08 OK?','Give me an action plan','Demand outlook for the next 3 months'];
 setTimeout(()=>say("Ask me about machines, spare parts, shortages or reorders. I answer from the live calculated plant data.",'a'),0);
 return `<h1>AI Maintenance Assistant</h1><div class="chips">${qs.map(q=>`<button onclick="ask(this.textContent)">${q}</button>`).join('')}</div><div class="card"><div id="chat"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="q" placeholder="Ask a question..." onkeydown="if(event.key=='Enter')ask()"><button class="send" onclick="ask()">Ask</button></div></div>`}};
function say(t,c){const e=document.createElement('div');e.className='msg '+c;e.textContent=t;$('#chat').append(e);$('#chat').scrollTop=1e9}
async function ask(t){const i=$('#q');t=t||i.value.trim();if(!t)return;i.value='';say(t,'u');try{const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:t})});say(r.answer,'a')}catch(e){say('Assistant unavailable: '+e.message,'a')}}
const drawer=h=>{$('#drawer').innerHTML=`<button class="x" onclick="$('#drawer').classList.remove('on')">Close</button>`+h;$('#drawer').classList.add('on')};
function machine(id){const m=M.find(x=>x.id==id);if(!m){load().then(()=>machine(id));return}
 drawer(`<h2>${m.id} ${m.name}</h2><p>${m.line} | ${B(m.priority)} score ${m.score}/100</p>${isAdmin()?`<p><button class="send" onclick="editMachine('${m.id}')">Edit</button> <button class="send" onclick="addReading('${m.id}')">Add sensor reading</button> <button class="send" style="background:var(--r);color:#fff" onclick="delItem('machines','${m.id}')">Delete</button></p>`:''}<h2>Why is ${m.id} ${m.priority} priority?</h2><ol>${m.reasons.map(r=>`<li>${r}</li>`).join('')}</ol><p><b>Therefore: ${m.verdict}.</b></p>
 <h2>Score breakdown</h2>${m.factors.map(f=>`${f.label} <small>${f.points}/${f.max}</small><div class="bar"><i style="width:${f.points/f.max*100}%"></i></div>`).join('')}
 <h2>Vibration (mm/s, 6 weeks)</h2>${line(m.vib,'#f2b705')}<h2>Temperature (C, 6 weeks)</h2>${line(m.temp,'#e5484d')}
 <h2>Spare parts used</h2>${m.parts.map(p=>`<a href="#" onclick="part('${p.id}');return false" style="color:var(--y)">${p.id} ${p.name}</a> ${B(p.risk)}<br>`).join('')}
 <h2>Work orders</h2>${m.wos.map(w=>`<small>${w.wdate} | ${w.type} | ${w.status} | ${w.note}</small><br>`).join('')}`)}
function part(id){const p=P.find(x=>x.id==id);if(!p){load().then(()=>part(id));return}
 drawer(`<h2>${p.id} ${p.name}</h2><p>${p.vendor} | Shortage risk ${B(p.risk)} | Reorder priority ${p.reorder_qty?B(p.priority):'None'}</p>${isAdmin()?`<p><button class="send" onclick="editPart('${p.id}')">Edit</button> <button class="send" style="background:var(--r);color:#fff" onclick="delItem('parts','${p.id}')">Delete</button></p>`:''}<h2>Why ${p.reorder_qty?'should '+p.id+' be reordered':'is no reorder needed for '+p.id}?</h2><ul>${p.reasons.map(r=>`<li>${r}</li>`).join('')}</ul><p><b>Action: ${p.action}.</b></p>
 <h2>Consumption and forecast</h2>${bars([...p.hist,p.demand],[...p.labels,p.next])}<h2>Machines using this part</h2>${p.machines.map(m=>`${m.id} ${m.name} (criticality ${m.crit}/5) ${B(m.priority)}<br>`).join('')}`)}
async function go(){if(!TOK){showLogin();return}const p=(location.hash||'#dashboard').slice(1);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==p));
 $('#drawer').classList.remove('on');try{if(!M.length)await load();$('#main').innerHTML=await (pages[p]||pages.dashboard)()}catch(e){$('#main').innerHTML=`<div class="err">Could not load data: ${e.message}. Is the backend running on this address?</div>`}}
const isAdmin=()=>ROLE=='admin';
function showLogin(){$('#login').style.display='flex';$('#lu').focus()}
function setUser(){$('#who').innerHTML=`Signed in: <b>${USER}</b> (${ROLE})<br><br><button class="send" onclick="logout()">Sign out</button>`}
async function doLogin(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});if(!r.ok)throw 0;const d=await r.json();TOK=d.token;ROLE=d.role;USER=d.username;localStorage.setItem('tok',TOK);localStorage.setItem('role',ROLE);localStorage.setItem('user',USER);$('#login').style.display='none';$('#lerr').textContent='';setUser();M=[];P=[];go()}catch(e){$('#lerr').textContent='Wrong username or password.'}}
function logout(){TOK=ROLE=USER=null;['tok','role','user'].forEach(k=>localStorage.removeItem(k));M=[];P=[];$('#who').innerHTML='';showLogin()}
function form(title,fields,vals,path,method,after){drawer(`<h2>${title}</h2>`+fields.map(([k,l,t,dis])=>`<label style="display:block;margin:8px 0 2px;color:var(--mu);font-size:12px">${l}</label><input id="f_${k}" type="${t||'text'}" step="any" value="${vals[k]??''}" ${dis?'disabled':''} style="width:100%">`).join('')+`<p id="ferr" class="err" style="padding:6px 0"></p><button class="send" id="fsave">Save</button>`);
 $('#fsave').onclick=async()=>{const b={};fields.forEach(([k,,t])=>{const v=$('#f_'+k).value;b[k]=t=='number'?Number(v):v});try{await api(path,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});await load();after(b)}catch(e){$('#ferr').textContent=e.message}}}
const MF=[['id','Machine ID (e.g. RW-05)'],['name','Machine name'],['line','Production line'],['crit','Criticality to production (1-5)','number'],['failures','Previous failures','number'],['days','Days since last maintenance','number'],['interval','Preventive maintenance interval (days)','number'],['usage','Production usage (%)','number'],['load','Next-week production load (%)','number']];
const MN=[['vib_start','Vibration 6 weeks ago (mm/s)','number'],['vib_now','Vibration now (mm/s)','number'],['temp_start','Temperature 6 weeks ago (C)','number'],['temp_now','Temperature now (C)','number']];
const refresh=async id=>{await go();if(id)machine(id)};
function addMachine(){form('Add machine',[...MF,...MN],{crit:3,failures:0,days:0,interval:90,usage:60,load:60,vib_start:1.2,vib_now:1.2,temp_start:45,temp_now:45},'/api/machines','POST',b=>refresh(b.id.toUpperCase()))}
function editMachine(id){const m=M.find(x=>x.id==id);form('Edit '+id,MF.map(f=>f[0]=='id'?['id','Machine ID','text',true]:f),m,'/api/machines/'+id,'PUT',()=>refresh(id))}
function addReading(id){form('New weekly sensor reading for '+id,[['vib','Vibration (mm/s)','number'],['temp','Temperature (C)','number']],{},`/api/machines/${id}/readings`,'POST',()=>refresh(id))}
const PF=[['id','Part ID (e.g. WT-103)'],['name','Part name'],['vendor','Supplier'],['stock','Current stock','number'],['lead','Supplier lead time (days)','number'],['safety','Safety stock','number'],['hist','Last 6 months consumption, oldest first (comma separated)'],['machines','Machines using it (comma separated IDs)']];
function addPart(){form('Add spare part',PF,{stock:10,lead:10,safety:5,hist:'5,5,6,6,7,7'},'/api/parts','POST',b=>{go();part(b.id.toUpperCase())})}
function editPart(id){const p=P.find(x=>x.id==id);form('Edit '+id,PF.map(f=>f[0]=='id'?['id','Part ID','text',true]:f),{...p,hist:p.hist.join(','),machines:p.machines.map(m=>m.id).join(',')},'/api/parts/'+id,'PUT',()=>{go();part(id)})}
async function delItem(kind,id){if(!confirm('Delete '+id+'? This cannot be undone.'))return;try{await api(`/api/${kind}/${id}`,{method:'DELETE'});await load();$('#drawer').classList.remove('on');go()}catch(e){alert(e.message)}}
if(TOK)setUser();
async function planAsk(t){const i=$('#pq');t=t||i.value.trim();if(!t)return;i.value='';$('#pa').textContent='Working...';try{const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:t})});$('#pa').textContent=r.answer}catch(e){$('#pa').textContent=e.message}}
async function recPage(){const d=await api('/api/recommendations'),S=d.summary;
 const dim=(n,x)=>`<div><b>${n}</b> ${B(x.level)} <small>${x.pts}/${x.max} pts</small><div class="bar"><i style="width:${x.pts/x.max*100}%"></i></div><small>${x.detail}</small></div>`;
 return `<h1>Explainable Recommendations &amp; Planning</h1><p style="color:var(--mu)">Every action is ranked on three things: operational criticality (how important the machines are), availability (can we get the parts in time) and risk (how likely a problem is). Each gets up to 35, 35 and 30 points.</p>
 <div class="grid k">${kpi(S.do_now,'DO NOW actions','bad')}${kpi(S.this_week,'THIS WEEK actions','warn')}${kpi(S.plan,'PLAN ahead actions','ok')}</div><br>
 <div class="card"><h2>Planning support: ask in plain language</h2><div class="chips">${['Give me an action plan','What should we do first?','What is the demand outlook for the next 3 months?'].map(q=>`<button onclick="planAsk(this.textContent)">${q}</button>`).join('')}</div><div style="display:flex;gap:8px"><input id="pq" placeholder="Ask about plans, priorities, reorders..." onkeydown="if(event.key=='Enter')planAsk()"><button class="send" onclick="planAsk()">Ask</button></div><div id="pa" style="white-space:pre-wrap;margin-top:10px"></div></div><br>
 <div class="grid two"><div class="card"><h2>Demand outlook: total spare-part units per month</h2>${bars(d.totals,d.months)}</div><div class="card wrap"><h2>Outlook by part (units)</h2><table><tr><th>Part</th>${d.months.map(m=>`<th>${m}</th>`).join('')}<th>Stock</th><th>Risk</th></tr>${d.outlook.slice(0,8).map(r=>`<tr class="c" onclick="part('${r.id}')"><td><b>${r.id}</b> ${r.name}</td>${r.months.map(v=>`<td>${v}</td>`).join('')}<td>${r.stock}</td><td>${B(r.risk)}</td></tr>`).join('')}</table></div></div>
 <h2 style="margin-top:18px">Ranked recommendations</h2>${d.recommendations.map((x,i)=>`<div class="card rec ${x.urgency_level}"><b>${i+1}. <span class="b ${x.urgency_level}">${x.urgency}</span> ${x.action}</b> <small>score ${x.score}/100</small><div class="grid two" style="margin:10px 0">${dim('Operational criticality',x.dims.criticality)}${dim('Availability',x.dims.availability)}${dim('Risk',x.dims.risk)}</div><small style="color:var(--y)">${x.why[3]}</small></div>`).join('')||'<div class="card">No action needed right now.</div>'}`}
let SIM={pct:20,line:'',text:'',res:null};
async function simPage(){await load();const lines=[...new Set(M.map(m=>m.line))].sort();
 return `<h1>WHAT-IF PRODUCTION SIMULATOR</h1><p style="color:var(--mu)">Test how production changes affect maintenance and spare-part requirements. Nothing is saved: the simulation is a temporary scenario.</p>
 <div class="card"><b>Production change</b><div class="pc" style="margin:8px 0 14px">${[-20,-10,0,10,20,30].map(v=>`<button class="send ${SIM.pct==v?'on':''}" onclick="setPct(${v})">${v>0?'+':''}${v}%</button>`).join('')}</div>
 <b>Or enter your own % change</b><div style="margin:8px 0 14px"><input id="simpct" type="number" step="any" placeholder="e.g. 25 or -15" style="width:140px;flex:none" oninput="customPct(this.value)"> <small style="color:var(--mu)">any value from -50 to 100</small></div><b>Production line</b><div style="margin:8px 0 14px"><select id="simline" onchange="SIM.line=this.value"><option value="">All Lines</option>${lines.map(l=>`<option ${SIM.line==l?'selected':''}>${l}</option>`).join('')}</select></div>
 <b>Or describe your own scenario</b><div style="margin:8px 0 14px"><input id="simtext" value="${SIM.text||''}" placeholder="What if production of robotics increases by 25%?" oninput="SIM.text=this.value" style="width:100%"><small style="color:var(--mu)">Examples: "robotic machines +25%", "paint shop production drops 15%", "welding workload up 30%". If this box has text, it is used instead of the buttons.</small></div><button class="send" onclick="runSim()">RUN SIMULATION</button> <button class="send" style="background:var(--p2);color:var(--tx)" onclick="resetSim()">Reset Simulation</button></div><div id="simout" style="margin-top:14px">${SIM.res?simHtml(SIM.res):'<div class="card" style="color:var(--mu)">Choose a scenario and click RUN SIMULATION. The default demo is +20% production.</div>'}</div>`}
function customPct(v){if(v==='')return;SIM.pct=Number(v);SIM.text='';$('#simtext').value='';document.querySelectorAll('.pc button').forEach(b=>b.classList.remove('on'))}
function setPct(v){SIM.pct=v;SIM.text='';$('#simtext').value='';$('#simpct').value='';document.querySelectorAll('.pc button').forEach(b=>b.classList.toggle('on',b.textContent==(v>0?'+':'')+v+'%'))}
async function runSim(){try{SIM.res=await api(SIM.text.trim()?'/api/simulate?text='+encodeURIComponent(SIM.text):'/api/simulate?pct='+SIM.pct+'&line='+encodeURIComponent(SIM.line));$('#simout').innerHTML=simHtml(SIM.res)}catch(e){$('#simout').innerHTML=`<div class="err">${e.message}</div>`}}
function resetSim(){SIM={pct:20,line:'',text:'',res:null};go()}
const dl=(a,b)=>{const x=b-a;return x>0?`<span class="up">&#9650; +${x}</span>`:x<0?`<span class="dn">&#9660; ${x}</span>`:'<span style="color:var(--mu)">no change</span>'};
function simHtml(r){const s=r.summary,pl=(r.pct>0?'+':'')+r.pct+'%',dp=s.demand_before?Math.round((s.demand_after-s.demand_before)/s.demand_before*100):0;
 const wp=r.parts.filter(p=>p.change=='up'),wm=r.machines.filter(m=>m.change=='up'),ch=r.machines.filter(m=>m.change!='same');
 const row=(l,a,b,f)=>`<tr><td>${l}</td><td>${f?f(a):a}</td><td><b>${f?f(b):b}</b></td><td>${typeof a=='number'?dl(a,b):''}</td></tr>`;
 return `<div class="card" style="margin-bottom:14px;border-left:5px solid var(--y)">${r.interpretation}${r.note?`<br><small style="color:var(--mu)">${r.note}</small>`:''}</div><div class="grid two"><div class="card"><h2>Before vs after (${r.line})</h2><table><tr><th></th><th>CURRENT</th><th>SIMULATED</th><th>Change</th></tr>
 ${row('Production',s.production_before,s.production_after,v=>v+'%')}${row('Spare-part demand (units)',s.demand_before,s.demand_after)}${row('Shortage risks (parts)',s.shortages_before,s.shortages_after)}${row('High-priority machines',s.high_before,s.high_after)}${row('Reorder quantity (units)',s.reorder_before,s.reorder_after)}</table></div>
 <div class="card" style="border-left:5px solid var(--y)"><h2>IMPACT OF ${pl} PRODUCTION</h2><p>&#128230; Spare-part demand: <b>${dp>0?'+':''}${dp}%</b> (${s.demand_before} to ${s.demand_after} units)</p><p>&#128680; Shortage risks: <b>${s.shortages_after-s.shortages_before>=0?'+':''}${s.shortages_after-s.shortages_before} parts</b></p><p>&#128295; High-priority machines: <b>${s.high_after-s.high_before>=0?'+':''}${s.high_after-s.high_before} machines</b></p><p>&#128203; Additional reorder requirement: <b>${s.reorder_after-s.reorder_before>=0?'+':''}${s.reorder_after-s.reorder_before} units</b></p></div></div>
 <h2 style="margin-top:18px">Why did these change?</h2>${[...wp.slice(0,5).map(p=>`<div class="card why"><b>WHY DID ${p.name.toUpperCase()} ${p.id} BECOME ${p.risk_after} RISK?</b><br>Before: demand ${p.demand_before}, stock ${p.stock}, risk ${p.risk_before}<br>After ${pl}: demand ${p.demand_after}, stock ${p.stock}, risk ${p.risk_after}<br><small>${p.reason}</small></div>`),...wm.map(m=>`<div class="card why"><b>WHY DID ${m.id} ${m.name.toUpperCase()} MOVE ${m.before} TO ${m.after}?</b><br><small>${m.reason}</small></div>`)].join('')||'<div class="card">No risk category changed in this scenario. Try a larger production change.</div>'}
 <h2 style="margin-top:18px">Machine impact</h2><div class="card wrap"><table><tr><th>Machine</th><th>Current priority</th><th>Simulated priority</th><th>Score</th><th>Reason</th></tr>${r.machines.map(m=>`<tr><td><b>${m.id}</b> ${m.name}</td><td>${B(m.before)}</td><td>${B(m.after)} ${m.change=='up'?'<span class="up">&#9650;</span>':m.change=='down'?'<span class="dn">&#9660;</span>':''}</td><td>${m.score_before} to ${m.score_after}</td><td><small>${m.reason}</small></td></tr>`).join('')}</table></div>
 <h2 style="margin-top:18px">Spare-part impact</h2><div class="card wrap"><table><tr><th>Part</th><th>Current demand</th><th>Simulated demand</th><th>Current stock</th><th>Risk (before to after)</th><th>New reorder qty</th></tr>${r.parts.map(p=>`<tr><td><b>${p.id}</b> ${p.name}</td><td>${p.demand_before}</td><td><b>${p.demand_after}</b></td><td>${p.stock}</td><td>${B(p.risk_before)} to ${B(p.risk_after)}</td><td>${p.reorder_before} to <b>${p.reorder_after}</b></td></tr>`).join('')}</table></div>
 <h2 style="margin-top:18px">Production-line impact</h2><div class="card wrap"><table><tr><th>Line</th><th>Machines</th><th>Avg risk score</th><th>High-priority machines</th></tr>${r.line_impact.map(l=>`<tr><td>${l.line}${l.in_scope?'':' <small>(not simulated)</small>'}</td><td>${l.machines}</td><td>${l.avg_before} to <b>${l.avg_after}</b> ${dl(l.avg_before,l.avg_after)}</td><td>${l.high_before} to <b>${l.high_after}</b></td></tr>`).join('')}</table></div>`}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>location.hash=a.dataset.p);addEventListener('hashchange',go);go();
</script></body></html>
